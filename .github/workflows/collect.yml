name: Collect Telegram posts

on:
  workflow_dispatch:
    inputs:
      report_provider:
        description: AI provider for this manual report (auto keeps Gemini primary)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - gemini
          - gemini_backup
          - groq
      force_report:
        description: Generate the report even if this date was already sent
        required: false
        default: false
        type: boolean
      send_report:
        description: Send the generated report to Telegram
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "3,33 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate report generator
        run: python -m unittest discover -s tests

      - name: Collect public posts
        run: python collector.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_API_KEY: ${{ secrets.GEMINI_BACKUP_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_BACKUP_MODEL: gemini-3.5-flash-lite
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          REPORT_PROVIDER: ${{ inputs.report_provider || 'auto' }}
          FORCE_MORNING_REPORT: ${{ inputs.force_report || 'false' }}
          SEND_MORNING_REPORT: ${{ github.event_name == 'schedule' || inputs.send_report == true }}

      - name: Save new data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Telegram feed"
            git push
          fi
